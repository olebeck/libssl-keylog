name: CMake Build and Release

on:
  push:
    branches:
      - master
    tags:
      v*

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake xz-utils
    
      - name: Install VitaSDK
        uses: olebeck/setup-vitasdk@v1

      - name: get stai
        run: |
          vdpm pacman --noconfirm -U https://github.com/olebeck/stai/releases/download/v0.9.0/stai-0.0.1-1-vita.pkg.tar.xz

      - name: Build
        run: |
          cmake -Bbuild -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target all

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('prerelease-{0}', github.sha) }}
          body: |
            Build from ${{ github.sha }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            build/libssl-keylog.suprx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
